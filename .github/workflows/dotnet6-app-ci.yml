name: .NetCore app CI

env:  
  DOTNET_VERSION: '6.0.x'                 

on:
  push:
    branches:
      - Dev
      - Stage
      - main
    paths: 
      - dotnet6-app/**
  workflow_dispatch:

jobs:
  build:
    name: 'Dotnet6-app Build'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: /home/runner/work/Demo/Demo/dotnet6-app

    steps:
      - uses: actions/checkout@v2

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/Dotnet6-App-Artifact

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v2
        with:
          name: .net-app-${{ github.ref_name }}
          path: ${{env.DOTNET_ROOT}}/Dotnet6-App-Artifact