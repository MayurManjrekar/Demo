apiVersion: apps/v1
kind: Deployment
metadata:
  name: containerised-app
  labels:
    app: containerised-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: containerised-app
  template:
    metadata:
      labels:
        app: containerised-app
    spec:
      tolerations:
      - key: "os"
        operator: "Equal"
        value: "linux"
        effect: "NoSchedule" 
      
      containers:
      - name: server
        image: containerised_image
        ports:
        - name: http-port
          containerPort: 8080

      - env:
        - name: PORT
          value: "8080"
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: productcatalogservice:3550
        - name: CURRENCY_SERVICE_ADDR
          value: currencyservice:7000
        - name: CART_SERVICE_ADDR
          value: cartservice:7070
        - name: RECOMMENDATION_SERVICE_ADDR
          value: recommendationservice:8080
        - name: SHIPPING_SERVICE_ADDR
          value: shippingservice:50051
        - name: CHECKOUT_SERVICE_ADDR
          value: checkoutservice:5050
        - name: AD_SERVICE_ADDR
          value: adservice:9555
        - name: ENABLE_PROFILER
          value: "0"

        livenessProbe:
          httpGet:
            path: /_healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        
        readinessProbe:
          httpGet:
            path: /_healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi